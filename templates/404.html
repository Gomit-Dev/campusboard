{% extends "base.html" %}

{% block title %}Page Not Found — CampusBoard{% endblock %}

{% block content %}
<div class="container page-container" style="text-align: center; padding: 4rem 1rem;">
    <div style="font-size: 5rem; font-weight: 800; color: var(--color-primary); line-height: 1;">404</div>
    <h1 style="font-size: 1.75rem; margin-top: 1rem; margin-bottom: 0.5rem; font-weight: 700;">Page Not Found</h1>
    <p style="color: var(--color-text-secondary); max-width: 480px; margin: 0 auto 2rem; font-size: 1rem;">
        The campus page or post you're looking for doesn't exist, has been removed, or moved to another link.
    </p>
    <div class="btn-group" style="justify-content: center;">
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">Back to Home</a>
        <a href="{% url 'posts:browse' %}" class="btn btn-secondary btn-lg">Explore Posts</a>
    </div>
</div>
{% endblock %}
