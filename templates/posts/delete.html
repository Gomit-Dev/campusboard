{% extends "base.html" %}

{% block title %}Delete Post — CampusBoard{% endblock %}

{% block content %}
<div class="container delete-page">
    <div class="delete-card">
        <div class="delete-icon" aria-hidden="true"><i class="bi bi-trash3-fill"></i></div>
        <h1>Delete this post?</h1>
        <p>This action cannot be undone. The post and all associated data will be permanently removed.</p>

        <div class="delete-post-title">{{ post.title }}</div>

        <form method="post">
            {% csrf_token %}
            <div class="btn-group" style="justify-content: center;">
                <button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-trash3-fill"></i> Delete Post</button>
                <a href="{% url 'posts:detail' pk=post.pk %}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
